id: testing
description: Test behavior and coverage decisions driven by changed behavior.
members:
  - testing.behavior-over-implementation
  - testing.change-driven-coverage
applicability:
  technologies: [typescript, javascript]
  filePatterns: ['**/*.test.ts', '**/*.test.tsx', '**/*.spec.ts', '**/*.spec.tsx', 'tests/**/*']
